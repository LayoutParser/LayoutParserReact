name: CI e Deploy Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layoutparser-web-development
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    name: Desenvolvimento HTTPS (React + BFF)
    runs-on: [self-hosted, windows, dev-local]
    timeout-minutes: 60
    environment:
      name: development
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do front falhou.' }
          npm ci --prefix server
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do BFF falhou.' }

      - name: Quality gates e builds same-origin
        shell: powershell
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Quality gates falharam.' }

      - name: Garantir ARR 3 no IIS de desenvolvimento
        shell: powershell
        run: ./scripts/Install-IisArr.ps1

      - name: Garantir HTTPS no IIS de desenvolvimento
        shell: powershell
        env:
          IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME_DEV }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST_DEV }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_NAME)) { throw 'Variável IIS_SITE_NAME_DEV ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_HOST)) { throw 'Variável PUBLIC_HOST_DEV ausente.' }

          ./scripts/Initialize-IisDevHttps.ps1 `
            -SiteName $env:IIS_SITE_NAME `
            -PublicHost $env:PUBLIC_HOST

      - name: Publicar ambiente de desenvolvimento
        shell: powershell
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_PATH_DEV }}
          IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME_DEV }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST_DEV }}
          LAYOUTPARSER_API_URL: ${{ vars.LAYOUTPARSER_API_URL_DEV }}
          BFF_ADMIN_USERS: ${{ secrets.BFF_ADMIN_USERS_DEV }}
          BFF_ADMIN_ROLES: ${{ secrets.BFF_ADMIN_ROLES_DEV }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ROOT)) { throw 'Variable DEPLOY_PATH_DEV ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_NAME)) { throw 'Variable IIS_SITE_NAME_DEV ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_HOST)) { throw 'Variable PUBLIC_HOST_DEV ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:LAYOUTPARSER_API_URL)) { throw 'Variable LAYOUTPARSER_API_URL_DEV ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_TENANT_ID)) { throw 'Variable ENTRA_TENANT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_CLIENT_ID)) { throw 'Variable ENTRA_CLIENT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_CLIENT_SECRET)) { throw 'Secret ENTRA_CLIENT_SECRET ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID)) { throw 'Variable GOOGLE_CLIENT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) { throw 'Secret GOOGLE_CLIENT_SECRET ausente.' }

          & ./scripts/Deploy-Iis.ps1 `
            -DeployRoot $env:DEPLOY_ROOT `
            -SiteName $env:IIS_SITE_NAME `
            -PublicHost $env:PUBLIC_HOST `
            -UpstreamUrl $env:LAYOUTPARSER_API_URL `
            -AdminUsers $env:BFF_ADMIN_USERS `
            -AdminRoles $env:BFF_ADMIN_ROLES `
            -EntraTenantId $env:ENTRA_TENANT_ID `
            -EntraClientId $env:ENTRA_CLIENT_ID `
            -EntraClientSecret $env:ENTRA_CLIENT_SECRET `
            -GoogleClientId $env:GOOGLE_CLIENT_ID `
            -GoogleClientSecret $env:GOOGLE_CLIENT_SECRET
