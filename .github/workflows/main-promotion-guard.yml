name: Main Promotion Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: main-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: Origem autorizada - develop
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validar fluxo develop para main
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$PR_BASE_REF" != "main" ]]; then
            echo "::error title=Destino invalido::Este gate protege exclusivamente a branch main."
            exit 1
          fi

          if [[ "$PR_HEAD_REF" != "develop" ]]; then
            echo "::error title=Origem de promocao invalida::PRs para main devem ter develop como branch de origem."
            exit 1
          fi

          echo "Promocao autorizada: develop -> main."
