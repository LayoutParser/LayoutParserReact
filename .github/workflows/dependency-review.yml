name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Bloquear dependencias vulneraveis
    # O conteudo do PR e tratado como nao confiavel e nunca alcanca runner self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Revisar mudancas de dependencias
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
