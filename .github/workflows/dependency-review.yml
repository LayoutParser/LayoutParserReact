name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Bloquear dependencias vulneraveis
    # O conteudo do PR e tratado como nao confiavel e nunca alcanca runner self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Revisar mudancas de dependencias
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
