name: Deploy LayoutParser Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layoutparser-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Produção HTTPS (React + BFF)
    runs-on: [self-hosted, windows, production]
    timeout-minutes: 60
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências reproduzíveis
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do front falhou.' }
          npm ci --prefix server
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do BFF falhou.' }

      - name: Quality gates e builds
        shell: pwsh
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Quality gates falharam.' }

      - name: Publicar release e reiniciar o BFF
        shell: pwsh
        env:
          DEPLOY_ROOT: ${{ secrets.DEPLOY_PATH }}
          IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          LAYOUTPARSER_API_URL: ${{ vars.LAYOUTPARSER_API_URL }}
          BFF_ADMIN_USERS: ${{ secrets.BFF_ADMIN_USERS }}
          BFF_ADMIN_ROLES: ${{ secrets.BFF_ADMIN_ROLES }}
          BFF_TRUSTED_PROXY_IPS: ${{ vars.BFF_TRUSTED_PROXY_IPS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ROOT)) { throw 'Secret DEPLOY_PATH ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_NAME)) { throw 'Variable IIS_SITE_NAME ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_HOST)) { throw 'Variable PUBLIC_HOST ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:LAYOUTPARSER_API_URL)) { throw 'Variable LAYOUTPARSER_API_URL ausente.' }

          $trustedProxies = if ([string]::IsNullOrWhiteSpace($env:BFF_TRUSTED_PROXY_IPS)) {
            '127.0.0.1'
          } else {
            $env:BFF_TRUSTED_PROXY_IPS
          }

          & ./scripts/Deploy-Iis.ps1 `
            -DeployRoot $env:DEPLOY_ROOT `
            -SiteName $env:IIS_SITE_NAME `
            -PublicHost $env:PUBLIC_HOST `
            -UpstreamUrl $env:LAYOUTPARSER_API_URL `
            -AdminUsers $env:BFF_ADMIN_USERS `
            -AdminRoles $env:BFF_ADMIN_ROLES `
            -TrustedProxyIps $trustedProxies
