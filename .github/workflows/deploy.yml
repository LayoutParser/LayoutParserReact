name: Deploy LayoutParser Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layoutparser-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Produção HTTPS (React + BFF)
    runs-on: [self-hosted, windows, production]
    timeout-minutes: 60
    environment:
      name: production
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Normalizar fim de linha do workspace
        shell: powershell
        run: |
          $lineEndingViolations = @(
            git -c "safe.directory=$env:GITHUB_WORKSPACE" ls-files --eol |
              Where-Object { $_ -match '\bw/crlf\b.*\beol=lf\b' }
          )
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível validar os finais de linha do workspace.' }

          $workspaceRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspacePrefix = $workspaceRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar) +
            [System.IO.Path]::DirectorySeparatorChar
          foreach ($violation in $lineEndingViolations) {
            $columns = $violation -split "`t", 2
            if ($columns.Count -ne 2) { throw "Saída inesperada de git ls-files --eol: $violation" }

            $relativePath = $columns[1]
            $fullPath = [System.IO.Path]::GetFullPath((Join-Path $workspaceRoot $relativePath))
            if (
              -not $fullPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not (Test-Path -LiteralPath $fullPath -PathType Leaf)
            ) {
              throw "Arquivo de normalização fora do workspace: $relativePath"
            }

            $bytes = [System.IO.File]::ReadAllBytes($fullPath)
            $normalizedBytes = New-Object System.Collections.Generic.List[byte]
            for ($index = 0; $index -lt $bytes.Length; $index++) {
              if ($bytes[$index] -eq 13 -and $index + 1 -lt $bytes.Length -and $bytes[$index + 1] -eq 10) {
                continue
              }
              $normalizedBytes.Add($bytes[$index])
            }
            [System.IO.File]::WriteAllBytes($fullPath, $normalizedBytes.ToArray())
          }

          $remainingViolations = @(
            git -c "safe.directory=$env:GITHUB_WORKSPACE" ls-files --eol |
              Where-Object { $_ -match '\bw/crlf\b.*\beol=lf\b' }
          )
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível verificar a normalização do workspace.' }
          if ($remainingViolations.Count -gt 0) {
            $remainingViolations | Write-Host
            throw 'O checkout ainda contém arquivos CRLF que deveriam estar em LF.'
          }

          git -c "safe.directory=$env:GITHUB_WORKSPACE" diff --exit-code --
          if ($LASTEXITCODE -ne 0) { throw 'A normalização alterou o conteúdo versionado.' }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências reproduzíveis
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do front falhou.' }
          npm ci --prefix server
          if ($LASTEXITCODE -ne 0) { throw 'npm ci do BFF falhou.' }

      - name: Quality gates e builds
        shell: powershell
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm run quality
          if ($LASTEXITCODE -ne 0) { throw 'Quality gates falharam.' }

      - name: Publicar release e reiniciar o BFF
        shell: powershell
        env:
          DEPLOY_ROOT: ${{ secrets.DEPLOY_PATH }}
          IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          LAYOUTPARSER_API_URL: ${{ vars.LAYOUTPARSER_API_URL }}
          BFF_ADMIN_USERS: ${{ secrets.BFF_ADMIN_USERS }}
          BFF_ADMIN_ROLES: ${{ secrets.BFF_ADMIN_ROLES }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ROOT)) { throw 'Secret DEPLOY_PATH ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_NAME)) { throw 'Variable IIS_SITE_NAME ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_HOST)) { throw 'Variable PUBLIC_HOST ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:LAYOUTPARSER_API_URL)) { throw 'Variable LAYOUTPARSER_API_URL ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_TENANT_ID)) { throw 'Variable ENTRA_TENANT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_CLIENT_ID)) { throw 'Variable ENTRA_CLIENT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:ENTRA_CLIENT_SECRET)) { throw 'Secret ENTRA_CLIENT_SECRET ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID)) { throw 'Variable GOOGLE_CLIENT_ID ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) { throw 'Secret GOOGLE_CLIENT_SECRET ausente.' }

          & ./scripts/Deploy-Iis.ps1 `
            -DeployRoot $env:DEPLOY_ROOT `
            -SiteName $env:IIS_SITE_NAME `
            -PublicHost $env:PUBLIC_HOST `
            -UpstreamUrl $env:LAYOUTPARSER_API_URL `
            -AdminUsers $env:BFF_ADMIN_USERS `
            -AdminRoles $env:BFF_ADMIN_ROLES `
            -EntraTenantId $env:ENTRA_TENANT_ID `
            -EntraClientId $env:ENTRA_CLIENT_ID `
            -EntraClientSecret $env:ENTRA_CLIENT_SECRET `
            -GoogleClientId $env:GOOGLE_CLIENT_ID `
            -GoogleClientSecret $env:GOOGLE_CLIENT_SECRET
